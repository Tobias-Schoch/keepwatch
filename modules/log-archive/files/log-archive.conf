# Keepwatch container log archive (keepwatch-log-archive).
# Initial values; change them in the dashboard (Settings → Log archive) or edit this file.
# The installer creates this file only if it is missing. The service re-reads it every minute.

# Keep logs for this many days (days in UTC, today counts extra). Range 1..90.
DAYS=14
# At most this much space per container (all days together; compressed + today uncompressed).
# Above it the oldest days go first; if today alone exceeds it, new lines are dropped until midnight UTC.
# Range 10..50000.
MAX_MB_PER_CONTAINER=300
# At most this much for the whole archive. Above it the oldest days of all containers go first.
# Range 50..200000.
MAX_MB_TOTAL=2000
