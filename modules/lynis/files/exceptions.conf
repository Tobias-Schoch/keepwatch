# Lynis: what is deliberately the way it is on a Keepwatch server - one sentence
# per test ID saying why.
#
# Installed as /etc/keepwatch/lynis-exceptions.conf (the copy from the repository
# wins on every deploy). The dashboard shows these findings as "deliberate"
# instead of as an open recommendation; Lynis itself still checks everything, and
# the index stays the one Lynis computed, so it remains comparable over time.
#
# Format:  TEST-ID[:sub-finding]  reason
#   A bare TEST-ID covers every sub-finding of that test.
#   Sub-finding (lower case): SSH option (SSH-7408), sysctl key (KRNL-6000),
#   file (FILE-7524), unit (BOOT-5264), protocol (NETW-3200) ...
#   If a new sub-finding shows up under a test ID, it is open again.
#
# Why no skip-test in the Lynis profile: a skipped test drops out of the
# calculation (the index jumps although nothing changed), and a later
# regression in the same test would go unnoticed. The reason would only be a
# comment in a file, not something the dashboard shows.

# --- Lynis itself
LYNIS  Lynis comes from the Ubuntu package and is kept current by the package updates; the version check against CISOfy is turned off in the profile.

# --- Boot and services
BOOT-5264:package-units  Units from Ubuntu packages (ssh, docker, containerd, cron ...) ship with their packages and need broad privileges; only the units Keepwatch installs itself stay open.
BOOT-5264:keepwatch-dashboard.service  The dashboard manages the server: it writes to /etc (update timers, fail2ban, backup, firewall), /srv/keepwatch/proxy and /var/backups/keepwatch and calls docker, systemctl, nft, tailscale and restic - everything none of these tasks touches is hardened (clock, hostname, kernel modules and log, namespaces, realtime, SUID); it listens only on 127.0.0.1.
BOOT-5122  Only someone logged in to the hosting provider's console can reach the boot menu - and they could mount the disk directly anyway.

# --- Accounts and passwords: login is by SSH key only; the root password is only the emergency access through the provider's console
AUTH-9230  Password hashing rounds only matter for password logins, and apart from the emergency access there are none (Ubuntu hashes with yescrypt anyway).
AUTH-9262  Password strength rules apply when a password is changed; there are no users here who set passwords.
AUTH-9282  An expiry date on the root password would lock out exactly the emergency access at the moment it is needed.
AUTH-9286  Minimum and maximum password age have no effect without password logins; the emergency access must not expire.
AUTH-9328  Only root logs in, and Keepwatch installs its files with explicit modes (install -m); a stricter umask would gain nothing.

# --- File systems, devices
FILE-6310  A VPS with one virtual disk; separate partitions for /home, /tmp and /var would only waste space - the dashboard watches the disk.
USB-1000  A virtual machine without physical access; nobody plugs a USB stick in here.

# --- Network, DNS, firewall
NAME-4028  The server is reached by its IP address, the proxy's domains or Tailscale (MagicDNS); the host itself needs no DNS domain name.
FIRE-4513  Rules with a zero counter are intended: blocks for rare cases (keepwatch-firewall in DOCKER-USER and INPUT, the ban history) and Docker's own chains.

# --- SSH: login by key only; with Tailscale, port 22 can be closed to the internet
SSH-7408:allowtcpforwarding  Deliberately set to "local": tunnels from the admin's machine to the dashboard and admin UIs (-L) must work, reverse tunnels (-R) must not (SSH hardening drop-in).
SSH-7408:loglevel  INFO already logs user, address and key fingerprint for every login; more logging adds nothing with key-only login.
SSH-7408:maxsessions  The desktop app and keepwatch deploy open several sessions; a limit of 2 adds no protection when login is by key only.
SSH-7408:port  Login is by key only, and with Tailscale port 22 can be closed to the internet; a different port would only be hiding.
SSH-7408:tcpkeepalive  Dead sessions are cleaned up by ClientAliveInterval; TCPKeepAlive does no harm.

# --- Kernel (sysctl): what Docker, Tailscale or the emergency access need, or what Ubuntu already sets more strictly
KRNL-6000:kernel.modules_disabled  Docker and Tailscale load kernel modules on demand (overlay, br_netfilter, nf_*, tun); locked, nothing would start after a reboot.
KRNL-6000:kernel.perf_event_paranoid  Ubuntu sets 4 - stricter than the 3 Lynis expects.
KRNL-6000:kernel.unprivileged_bpf_disabled  Ubuntu sets 2 - also locked (only root can unlock it again); Lynis only knows 1.
KRNL-6000:kernel.sysrq  176 only allows sync, remount read-only and reboot through the provider's console - the last resort when the server hangs.
KRNL-6000:net.ipv4.conf.all.forwarding  Docker forwards packets between its networks and to the outside; without forwarding every website would go down.
KRNL-6000:net.ipv4.conf.all.rp_filter  Ubuntu default 2 (loose); strict (1) drops valid packets on Tailscale and Docker networks.
KRNL-6000:kernel.core_uses_pid  Only affects the names of core dumps; those are turned off entirely (see KRNL-5820).

# --- Packages, tools
PKGS-7370  debsums checks against checksums stored on the same system; auditd sees changes to important files immediately, and packages come only from signed sources.
PKGS-7394  The dashboard shows pending updates itself and they are installed automatically at night; apt-show-versions is not needed for that.
TOOL-5002  The automation is Keepwatch itself (modules applied by keepwatch deploy); Lynis only knows Ansible, Puppet and the like.

# --- Logging, accounting, integrity
LOGG-2154  A separate log server would be a second server just for that; what matters is recorded by the dashboard (timeline, logins, container log archive), and auditd reports changes to important files immediately.
LOGG-2190  Deleted files that are still open are almost all inside containers (databases, programs from the images); what remains on the host after updates is cleared by the next reboot.
BANN-7126  A warning text in /etc/issue is of no use on a server without local logins.
BANN-7130  sshd does not show /etc/issue.net (no banner set), and login is by key only.
ACCT-9622  Process accounting (acct) produces a lot of log without benefit; what matters (accounts, sudo, keys, services) is watched by auditd.
ACCT-9626  sysstat is not needed: the dashboard measures CPU, memory and network itself.
FINT-4350  auditd watches the important files (SSH keys, sudo, accounts, services, cron, firewall) in real time, and the dashboard shows every change.
HRDN-7230  Trivy scans the container images every week; a virus scanner on the host (ClamAV, rkhunter) would mostly produce false alarms with Docker.
