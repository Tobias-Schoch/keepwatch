# Keepwatch kernel hardening (Lynis KRNL-6000, KRNL-5820).
# Installed as /etc/sysctl.d/99-zz-keepwatch.conf: the name must sort after
# /usr/lib/sysctl.d/99-protect-links.conf, which would set protected_fifos
# back to 1 otherwise.
# Forwarding (ip_forward, forwarding) and rp_filter stay as Docker and
# Tailscale need them; what deliberately differs from Lynis' advice is
# explained in the Lynis exceptions.

# No core dumps (apport is removed, systemd-coredump not installed).
fs.suid_dumpable = 0
kernel.core_pattern = |/bin/false

# Processes and kernel
dev.tty.ldisc_autoload = 0
fs.protected_fifos = 2
kernel.kptr_restrict = 2
net.core.bpf_jit_harden = 2

# Neither send nor accept ICMP redirects, no source routing - also on
# interfaces created later (Docker networks, veth, tailscale0 inherit "default").
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.default.accept_source_route = 0
