# Keepwatch: rare network protocols nobody uses on a web server (Lynis NETW-3200).
# "install ... /bin/true" also blocks loading them on demand (/bin/true rather
# than /bin/false: Lynis 3.0.x only recognises /bin/true).
blacklist dccp
blacklist sctp
blacklist rds
blacklist tipc
install dccp /bin/true
install sctp /bin/true
install rds /bin/true
install tipc /bin/true
