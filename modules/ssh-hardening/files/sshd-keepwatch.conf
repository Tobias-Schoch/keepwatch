# Keepwatch SSH hardening (ssh-hardening module).
#
# A drop-in of its own, so an update of the main sshd_config never
# overwrites it. Named 00-…: for most options sshd keeps the FIRST value it
# reads, and drop-ins are read in name order - a provider's
# 50-cloud-init.conf with "PasswordAuthentication yes" would win otherwise.

# Keys only. The root password (if any) is for the provider's console, the
# emergency door - never for SSH.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PermitEmptyPasswords no

# Not needed, and needless attack surface.
X11Forwarding no

# Logins work with a key or not at all; three attempts are plenty.
MaxAuthTries 3
LoginGraceTime 30

# Clean up dead sessions after 10 minutes.
ClientAliveInterval 300
ClientAliveCountMax 2

# No agent forwarding (ssh -A): a compromised server could otherwise use the
# keys of your computer while you are logged in.
AllowAgentForwarding no
# Tunnels from your computer to the server (-L: dashboard, admin UIs) keep
# working, reverse tunnels (-R) do not. Never "no" - that kills the tunnel
# the dashboard is reached through.
AllowTcpForwarding local
