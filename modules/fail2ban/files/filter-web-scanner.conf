# Keepwatch: /etc/fail2ban/filter.d/keepwatch-web-scanner.conf
# Bots probing your websites for leftovers: .env, .git, WordPress,
# phpMyAdmin, phpinfo, backups of config files ... If none of your sites runs
# PHP or WordPress, whoever asks for them is a scanner. (Running WordPress?
# Switch KW_F2B_WEB_SCANNER off or remove the wp-* and .php patterns here.)
#
# Two Nginx Proxy Manager log formats:
#   proxy-host-*/fallback:  [23/Oct/2026:18:36:23 +0000] ... "/path" [Client 1.2.3.4] ...
#   default-host (combined): 1.2.3.4 - - [23/Oct/2026:16:18:26 +0000] "GET /path HTTP/1.1" ...
[Definition]
_probe = (?:/\.env|/\.git/|/\.svn/|/\.aws/|/\.DS_Store|wp-login|wp-admin|wp-config|wp-content|wp-includes|xmlrpc|phpmyadmin|phpinfo|\.php(?:[~.?"\s]|$)|/vendor/phpunit|/cgi-bin/|/actuator|/server-status|/\.well-known/security\.txt\.bak|\.sql(?:\.gz)?["?\s]|/backup\.(?:zip|tar))
failregex = "[^"]*%(_probe)s[^"]*" \[Client <HOST>\]
            ^<HOST> \S+ \S+ .*"[A-Z]+ [^"]*%(_probe)s[^"]*"
ignoreregex = /\.well-known/acme-challenge/
# fail2ban cuts the timestamp out of the line before matching.
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z
