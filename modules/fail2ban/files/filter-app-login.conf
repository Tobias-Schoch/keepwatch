# Keepwatch: /etc/fail2ban/filter.d/keepwatch-app-login.conf
# Failed logins on your websites: wrong password or admin token (401/403) on
# admin and login paths - /admin, /api/admin/..., .../login, .../signin.
#
# 429 deliberately does not count: that is an app's own rate limit, which you
# trigger yourself now and then. 403 only counts on these paths - a site
# behind an IP allow-list must not ban visitors who merely open its home page.
#
# Nginx Proxy Manager log format of proxy-host-* (fail2ban cuts the
# timestamp out before matching):
#   [23/Oct/2026:20:12:48 +0000] - 401 401 - POST https example.com "/api/admin/login" [Client 1.2.3.4] ...
[Definition]
_path = (?:/api/admin/|/admin(?:[/?"]|$)|/(?:api/(?:v\d/)?)?(?:auth/)?(?:login|signin|sign-in)(?:[/?"]))
failregex = (?:401|403) - [A-Z]+ https? \S+ "%(_path)s[^"]*" \[Client <HOST>\]
ignoreregex =
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z
